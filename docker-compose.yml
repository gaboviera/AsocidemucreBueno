version: '3.8'

services:
  web:
    build: .
    container_name: asocidemucre_web_container
    ports:
      - "5000:5000"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_NAME=${DB_NAME:-asocidemucre_db}
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-asocidemucre_secreta}
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:17
    container_name: asocidemucre_db_container
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-asocidemucre_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

